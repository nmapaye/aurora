name: App CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/app-ci.yml'
      - '.node-version'
      - 'App.tsx'
      - 'app.json'
      - 'assets/**'
      - 'babel.config.js'
      - 'eas.json'
      - 'eslint.config.mjs'
      - 'expo-env.d.ts'
      - 'jest.config.ts'
      - 'metro.config.js'
      - 'package-lock.json'
      - 'package.json'
      - 'patches/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'
      - 'ios/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/app-ci.yml'
      - '.node-version'
      - 'App.tsx'
      - 'app.json'
      - 'assets/**'
      - 'babel.config.js'
      - 'eas.json'
      - 'eslint.config.mjs'
      - 'expo-env.d.ts'
      - 'jest.config.ts'
      - 'metro.config.js'
      - 'package-lock.json'
      - 'package.json'
      - 'patches/**'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'
      - 'tsconfig.json'
      - 'ios/**'
  workflow_dispatch:
    inputs:
      update_native_lock:
        description: Generate a native lock update artifact for review
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type-check app
        run: npm run type-check

      - name: Lint app
        run: npm run lint

      - name: Test app
        run: npm test -- --runInBand --no-cache

  ios-native:
    name: iOS Xcode
    needs: test
    runs-on: macos-26
    timeout-minutes: 60
    env:
      COCOAPODS_DISABLE_STATS: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install locked CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Generate native lock update
        if: github.event_name == 'workflow_dispatch' && inputs.update_native_lock
        run: |
          cd ios
          pod _1.16.2_ update --no-repo-update
          git diff --binary -- . > "$RUNNER_TEMP/native-lock.patch"

      - name: Upload native lock update
        if: github.event_name == 'workflow_dispatch' && inputs.update_native_lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-lock-update
          path: ${{ runner.temp }}/native-lock.patch
          if-no-files-found: error

      - name: Bootstrap locked iOS dependencies
        if: github.event_name != 'workflow_dispatch' || !inputs.update_native_lock
        run: npm run ios:bootstrap -- --deployment

      - name: Reject native dependency drift
        if: github.event_name != 'workflow_dispatch' || !inputs.update_native_lock
        run: git diff --exit-code -- ios

      - name: Build Debug for iOS Simulator
        if: github.event_name != 'workflow_dispatch' || !inputs.update_native_lock
        run: npm run ios:build:debug -- -quiet

      - name: Build Release for iOS Simulator
        if: github.event_name != 'workflow_dispatch' || !inputs.update_native_lock
        run: npm run ios:build:release -- -quiet

name: iOS App

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-design-tokens.py'
      - 'Aurora/**'
      - 'AuroraCore/**'
      - 'AuroraTests/**'
      - 'AuroraUITests/**'
      - 'Aurora.xcodeproj/**'
      - '.github/workflows/ios-app-ci.yml'
      - '.github/scripts/xcode-annotate.py'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run this workflow whatever they touch, so the gate below
  # always reports. The real jobs run only when in the app changed.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Compare with the base branch
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull_request checkout is the merge commit; its first parent is
          # the base branch, so this lists what the PR changes.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if grep -qE '^(scripts/check-design-tokens\.py$|Aurora/|AuroraCore/|AuroraTests/|AuroraUITests/|Aurora\.xcodeproj/|\.github/workflows/ios-app-ci\.yml$|\.github/scripts/xcode-annotate\.py$)' <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: ios-app (${{ matrix.device }})
    runs-on: macos-26
    # Build, native tests and the full serial UI suite (about 30 minutes on
    # a hosted runner per device) do not fit in an hour.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check native brand tokens
        run: python3 scripts/check-design-tokens.py

      # Simulator builds use Info-Simulator.plist, which must equal Info.plist
      # plus only NSAllowsLocalNetworking (for the simulator Ollama path).
      - name: Check simulator Info.plist parity
        run: |
          python3 - <<'PY'
          import plistlib, sys
          device = plistlib.load(open('Aurora/Info.plist', 'rb'))
          sim = plistlib.load(open('Aurora/Info-Simulator.plist', 'rb'))
          if 'NSAppTransportSecurity' in device:
              sys.exit('Aurora/Info.plist must not contain NSAppTransportSecurity')
          if sim.pop('NSAppTransportSecurity', None) != {'NSAllowsLocalNetworking': True}:
              sys.exit('Info-Simulator.plist must set only NSAllowsLocalNetworking under NSAppTransportSecurity')
          if sim != device:
              sys.exit('Info-Simulator.plist differs from Info.plist beyond NSAppTransportSecurity')
          PY

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          kind = '${{ matrix.device }}'
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((r for r in devices if 'iOS' in r), reverse=True)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d['name'].startswith(kind):
                      print(d['udid']); sys.exit(0)
          sys.exit('no ' + kind + ' simulator found')
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Boot the simulator and wait until it is fully up before any test
      # launches the app; a cold iPad simulator booting during the first
      # launch timed out the launch.
      - name: Boot simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      # Tests are signed ad hoc: unsigned, the Keychain erase test fails
      # with errSecMissingEntitlement (-34018).
      - name: Build for testing
        run: |
          mkdir -p build
          set +e
          xcodebuild build-for-testing \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            > build/xcodebuild-build.log 2>&1
          status=$?
          grep -E "error:|\*\* .* \*\*" build/xcodebuild-build.log | head -200
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-build.log
          exit $status

      # The Debug simulator app from Build for testing must keep the
      # local networking exception that the simulator-only Ollama path uses.
      - name: Simulator Info.plist keeps local networking
        run: |
          set -euo pipefail
          sim=build/DerivedData/Build/Products/Debug-iphonesimulator/Aurora.app/Info.plist
          if [ "$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - "$sim")" != "true" ]; then
            echo "::error::Simulator Info.plist must set NSAllowsLocalNetworking"
            plutil -p "$sim"
            exit 1
          fi
          echo "Simulator Info.plist keeps NSAllowsLocalNetworking."

      - name: Test
        run: |
          set +e
          xcodebuild test-without-building \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -resultBundlePath build/AuroraTests.xcresult \
            > build/xcodebuild-test.log 2>&1
          status=$?
          grep -E "error:|warning: .*/Aurora|Test [Cc]ase '.*' failed|Test Suite '.*' failed|✘|\*\* .* \*\*|Executed" build/xcodebuild-test.log | head -400
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-test.log
          # Launch and runner failures don't use the error: format; surface them
          # too, within the ten error annotations a step keeps.
          grep -iE "failed to launch|timed out|launch timeout|crashed|lost connection|failed background assertion|signal [0-9]+" build/xcodebuild-test.log \
            | sort -u | head -6 | while IFS= read -r line; do echo "::error title=xcodebuild launch::${line//%/%25}"; done
          exit $status

      # The only Release build. It targets a generic iOS device, so CI checks
      # the Info.plist that would ship: no local networking exception.
      - name: Release device build
        if: matrix.device == 'iPhone'
        run: |
          mkdir -p build
          set +e
          xcodebuild build \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > build/xcodebuild-release-device.log 2>&1
          status=$?
          grep -E "error:|\*\* .* \*\*" build/xcodebuild-release-device.log | head -200
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-release-device.log
          [ $status -eq 0 ] || exit $status
          set -e
          device=build/DerivedData/Build/Products/Release-iphoneos/Aurora.app/Info.plist
          if plutil -extract NSAppTransportSecurity xml1 -o - "$device" >/dev/null 2>&1; then
            echo "::error::Release device Info.plist contains NSAppTransportSecurity"
            plutil -p "$device"
            exit 1
          fi
          echo "Release device Info.plist has no NSAppTransportSecurity."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-logs-${{ matrix.device }}
          path: |
            build/*.log
            build/AuroraTests.xcresult

  # The one check the main ruleset requires. It passes when every job
  # passed, or when the jobs were skipped because nothing in the app changed.
  gate:
    name: iOS App gate
    needs: [changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = "success" ] || { echo "::error::changes job: $CHANGES"; exit 1; }
          check() {
            case "$2" in
              success|skipped) echo "$1: $2" ;;
              *) echo "::error::$1: $2"; exit 1 ;;
            esac
          }
          check "build-and-test" "${{ needs.build-and-test.result }}"

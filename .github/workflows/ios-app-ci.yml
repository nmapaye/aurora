name: iOS App

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-design-tokens.py'
      - 'Aurora/**'
      - 'AuroraCore/**'
      - 'AuroraTests/**'
      - 'AuroraUITests/**'
      - 'Aurora.xcodeproj/**'
      - 'Config/**'
      - '.github/workflows/ios-app-ci.yml'
      - '.github/scripts/xcode-annotate.py'
      - '.github/scripts/verify_xcresult.py'
      - '.github/scripts/test_xcresult.py'
      - '.github/scripts/verify_beta_scope.py'
      - '.github/scripts/test_beta_scope.py'
      - '.github/scripts/soft_cancel_rerun.py'
      - '.github/scripts/test_soft_cancel_rerun.py'
      - '.github/scripts/keyboard-mode-log.sh'
      - '.github/scripts/keyboard_minimize_check.py'
      - '.github/scripts/test_keyboard_minimize_check.py'
      - '.github/scripts/fixtures/soft_cancel/**'
      - '.github/scripts/fixtures/keyboard_minimize/**'
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed 40-character source SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.event_name == 'workflow_dispatch' && 'artifact-only' || 'ci' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Pull requests run this workflow whatever they touch, so the gate below
  # always reports. The real jobs run only when in the app changed.
  changes:
    if: github.event_name != 'workflow_dispatch'
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Compare with the base branch
        id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull_request checkout is the merge commit; its first parent is
          # the base branch, so this lists what the PR changes.
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if grep -qE '^(scripts/check-design-tokens\.py$|Aurora/|AuroraCore/|AuroraTests/|AuroraUITests/|Aurora\.xcodeproj/|Config/|\.github/workflows/ios-app-ci\.yml$|\.github/scripts/(xcode-annotate|verify_xcresult|test_xcresult|verify_beta_scope|test_beta_scope|soft_cancel_rerun|test_soft_cancel_rerun|keyboard_minimize_check|test_keyboard_minimize_check)\.py$|\.github/scripts/keyboard-mode-log\.sh$|\.github/scripts/fixtures/(soft_cancel|keyboard_minimize)/)' <<< "$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Linux-only, about 10 seconds: checks Aurora/PrivacyInfo.xcprivacy against
  # the code (required-reason APIs, tracking, collected data, network hosts).
  # Runs on every pull request so a change that adds a required-reason API
  # fails here even when nothing else in the app changed.
  privacy-manifest:
    if: github.event_name != 'workflow_dispatch'
    name: privacy manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify privacy manifest
        run: python3 scripts/verify-privacy-manifest.py --verbose

  build-and-test:
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.relevant == 'true'
    name: ios-app (${{ matrix.device }})
    runs-on: macos-26
    # Build, native tests and the full serial UI suite (about 30 minutes on
    # a hosted runner per device) do not fit in an hour. 240 leaves room for
    # the one soft-cancel rerun of a UI step (BUG-1d, see soft_cancel_rerun.py).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check native brand tokens
        run: python3 scripts/check-design-tokens.py

      # Simulator builds use Info-Simulator.plist, which must equal Info.plist
      # plus only NSAllowsLocalNetworking (for the simulator Ollama path).
      - name: Check simulator Info.plist parity
        run: |
          python3 - <<'PY'
          import plistlib, sys
          device = plistlib.load(open('Aurora/Info.plist', 'rb'))
          sim = plistlib.load(open('Aurora/Info-Simulator.plist', 'rb'))
          if 'NSAppTransportSecurity' in device:
              sys.exit('Aurora/Info.plist must not contain NSAppTransportSecurity')
          if sim.pop('NSAppTransportSecurity', None) != {'NSAllowsLocalNetworking': True}:
              sys.exit('Info-Simulator.plist must set only NSAllowsLocalNetworking under NSAppTransportSecurity')
          if sim != device:
              sys.exit('Info-Simulator.plist differs from Info.plist beyond NSAppTransportSecurity')
          PY

      - name: Pick a simulator
        id: sim
        run: |
          set -euo pipefail
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          kind = '${{ matrix.device }}'
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((r for r in devices if 'iOS' in r), reverse=True)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d['name'].startswith(kind):
                      print(d['udid']); sys.exit(0)
          sys.exit('no ' + kind + ' simulator found')
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # typeText has been losing keystrokes in the composer (see the repeat
      # step below). Simulator.app's "Connect Hardware Keyboard" is a known
      # cause of dropped typeText characters, so turn it off globally and for
      # this device before it boots. CI boots headless with simctl, so this
      # may be a no-op here; it keeps a Simulator.app launch from changing it.
      - name: Disconnect the hardware keyboard
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          plist="$RUNNER_TEMP/iphonesimulator.plist"
          defaults export com.apple.iphonesimulator "$plist"
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$udid dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :DevicePreferences:$udid:ConnectHardwareKeyboard" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$udid:ConnectHardwareKeyboard bool false" "$plist"
          defaults import com.apple.iphonesimulator "$plist"
          echo "ConnectHardwareKeyboard (global): $(defaults read com.apple.iphonesimulator ConnectHardwareKeyboard)"
          echo "ConnectHardwareKeyboard ($udid): $(/usr/libexec/PlistBuddy -c "Print :DevicePreferences:$udid:ConnectHardwareKeyboard" "$plist")"

      # Boot the simulator and wait until it is fully up before any test
      # launches the app; a cold iPad simulator booting during the first
      # launch timed out the launch.
      - name: Boot simulator
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # BUG-1d (#71) 1b: a headless simctl boot ignores
          # ConnectHardwareKeyboard=false, and on CI's iPad the virtual HID
          # keyboard put UIKit into its hardware-keyboard (minimized)
          # presentation mid-tap, which lost the first Save tap. Simulator.app
          # applies the preference to the device it attaches to. iPad only:
          # the iPhone job is unchanged.
          if [ "${{ matrix.device }}" = "iPad" ]; then
            open -a Simulator --args -CurrentDeviceUDID "$udid"
            for _ in $(seq 1 60); do
              if pgrep -x Simulator >/dev/null && xcrun simctl list devices booted | grep -q "$udid"; then break; fi
              sleep 1
            done
            pgrep -x Simulator >/dev/null || { echo "::error title=Simulator.app::Simulator.app did not start"; exit 1; }
            xcrun simctl list devices booted | grep -q "$udid" || { echo "::error title=Simulator.app::$udid is no longer booted"; exit 1; }
            xcrun simctl bootstatus "$udid" -b
            echo "Simulator.app attached to $udid"
          fi

      # Fix the software keyboard's state before any UI test types: no
      # predictive text or autocorrection (the app log shows the predictive
      # engine's CandidateGeneration timing out while typeText runs), no
      # slide-to-type, and the first-use keyboard introductions marked shown.
      # Key names are the ones WebDriverAgent sets through TIPreferencesController
      # and Appium writes with simctl; iOS 15+ keeps them in
      # com.apple.keyboard.preferences, older releases in com.apple.Preferences.
      - name: Set simulator keyboard preferences
        run: |
          set -euo pipefail
          udid="${{ steps.sim.outputs.udid }}"
          for domain in com.apple.keyboard.preferences com.apple.Preferences; do
            for key in KeyboardPrediction KeyboardAutocorrection KeyboardShowPredictionBar KeyboardContinuousPathEnabled; do
              xcrun simctl spawn "$udid" defaults write "$domain" "$key" -bool NO
            done
            for key in DidShowContinuousPathIntroduction DidShowGestureKeyboardIntroduction; do
              xcrun simctl spawn "$udid" defaults write "$domain" "$key" -bool YES
            done
          done
          xcrun simctl spawn "$udid" defaults write com.apple.keyboard.ContinuousPath KeyboardContinuousPathEnabled -bool NO
          # Fail if a write didn't stick, rather than run on unknown settings.
          for check in KeyboardPrediction=0 KeyboardAutocorrection=0 KeyboardShowPredictionBar=0 \
                       KeyboardContinuousPathEnabled=0 DidShowContinuousPathIntroduction=1 DidShowGestureKeyboardIntroduction=1; do
            key=${check%=*}; want=${check#*=}
            got=$(xcrun simctl spawn "$udid" defaults read com.apple.keyboard.preferences "$key")
            echo "com.apple.keyboard.preferences $key = $got"
            [ "$got" = "$want" ] || { echo "::error title=keyboard prefs::$key is $got, wanted $want"; exit 1; }
          done

      # Tests are signed ad hoc: unsigned, the Keychain erase test fails
      # with errSecMissingEntitlement (-34018).
      - name: Build for testing
        run: |
          mkdir -p build
          set +e
          xcodebuild build-for-testing \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            > build/xcodebuild-build.log 2>&1
          status=$?
          grep -E "error:|\*\* .* \*\*" build/xcodebuild-build.log | head -200
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-build.log
          exit $status

      # The Debug simulator app from Build for testing must keep the
      # local networking exception that the simulator-only Ollama path uses.
      - name: Simulator Info.plist keeps local networking
        run: |
          set -euo pipefail
          sim=build/DerivedData/Build/Products/Debug-iphonesimulator/Aurora.app/Info.plist
          if [ "$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw -o - "$sim")" != "true" ]; then
            echo "::error::Simulator Info.plist must set NSAllowsLocalNetworking"
            plutil -p "$sim"
            exit 1
          fi
          echo "Simulator Info.plist keeps NSAllowsLocalNetworking."

      # BUG-1d (#71) 1b: fail early, before any other UI test, if the iPad
      # simulator still behaves as if a hardware keyboard is attached. The
      # probe is an unchanged existing test that types into the numberPad
      # amount field and then taps the next field: the one passing test in
      # run 41378408179 whose tap triggered -[UIKeyboard setMinimized:].
      # After it, no real minimize event may be logged: setMinimized with
      # minimized = 1 (or no value), visualMode -> 2, or a floating-assistant
      # presentation. keyboard_minimize_check.py ignores `minimized = 0` and
      # the probe's own `log show` command line (the run-41957713689 false
      # positive), and exits 2 on a missing or unreadable capture. A clean probe does not prove the keyboard is detached (the
      # minimize was rare); keyboard-mode-test.log checks the full suite.
      # Run 41965189274 (437a1c0) showed Simulator.app does not detach the
      # HID keyboard, and the owner chose the app fix (1b option i): draft
      # Save commits from UIKit's touch-up (PrimaryTouchButton), so the
      # unchanged testDraftFieldKeepsSaveAboveCollapsedComposer must pass
      # with the keyboard attached. A minimize here is now reported, not
      # fatal; a failed probe test or an unreadable capture still fails.
      - name: Probe the iPad keyboard presentation
        if: matrix.device == 'iPad'
        run: |
          set +e
          udid="${{ steps.sim.outputs.udid }}"
          date +%s > build/probe.started
          xcodebuild test-without-building \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination "id=$udid" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:AuroraUITests/AuroraUITests/testCaffeineNeedsReviewAndUndoRemovesOnlySavedEntry \
            -resultBundlePath build/KeyboardProbe.xcresult \
            > build/xcodebuild-keyboard-probe.log 2>&1
          status=$?
          grep -E "error:|Test [Cc]ase '.*' (passed|failed)|\*\* .* \*\*|Executed" build/xcodebuild-keyboard-probe.log | head -50
          bash .github/scripts/keyboard-mode-log.sh "$udid" probe
          python3 .github/scripts/keyboard_minimize_check.py build/keyboard-mode-probe.log
          check=$?
          if [ "$status" -ne 0 ]; then
            echo "::error title=keyboard probe::the probe test failed (status $status); see xcodebuild-keyboard-probe.log"
            exit 1
          fi
          if [ "$check" -eq 1 ]; then
            echo "::warning title=hardware keyboard attached::minimize event(s) after focusing a field (listed above); see keyboard-mode-probe.log. The Test step's one-tap Save runs against this (BUG-1d 1b option i)."
          elif [ "$check" -ne 0 ]; then
            echo "::error title=keyboard probe::keyboard-mode-probe.log is missing or not a compact log capture (check status $check)"
            exit 1
          else
            echo "Keyboard probe: no minimized presentation after focusing a field."
          fi

      # testLongCardArrivesShowingItsStart failed intermittently on iPhone
      # (about 2 in 25 runs). Run it alone up to 40 times on both devices and
      # stop at the first failure. Never -retry-tests-on-failure here: a retry
      # would turn the flake green and hide it. Each iteration launches the
      # app (about 40 to 65 seconds in CI), so 40 fit inside the timeout.
      - name: Repeat the long-card UI test
        id: repeat
        timeout-minutes: 100
        run: |
          set +e
          if ! xcodebuild -help 2>&1 | grep -q -- '-run-tests-until-failure'; then
            echo "::error title=xcodebuild::this Xcode has no -run-tests-until-failure"
            exit 1
          fi
          date +%s > build/longcard.started
          # One in-job rerun only for a backboardd soft cancel (BUG-1d,
          # soft_cancel_rerun.py); the rerun writes *-rerun.log/-Rerun.xcresult.
          python3 .github/scripts/soft_cancel_rerun.py run \
            --log build/xcodebuild-repeat.log \
            --result build/LongCardRepeat.xcresult \
            --verify "python3 .github/scripts/verify_xcresult.py {result} --iteration-log {log} --test-case testLongCardArrivesShowingItsStart --expected-iterations 40" \
            --udid "${{ steps.sim.outputs.udid }}" \
            --touch-log build/keyboard-mode-longcard \
            -- xcodebuild test-without-building \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:AuroraUITests/AuroraUITests/testLongCardArrivesShowingItsStart \
            -test-iterations 40 \
            -run-tests-until-failure
          status=$?
          for log in build/xcodebuild-repeat.log build/xcodebuild-repeat-rerun.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            grep -E "error:|Test [Cc]ase '.*' failed|Test Suite '.*' failed|✘|\*\* .* \*\*|Executed" "$log" | head -200
            echo "Iterations run: $(grep -cE "Test Case '.*testLongCardArrivesShowingItsStart\]' (passed|failed)" "$log")"
            python3 .github/scripts/xcode-annotate.py "$log"
          done
          exit $status

      - name: Keyboard-mode and touch diagnostics (long-card repeat)
        if: always()
        run: bash .github/scripts/keyboard-mode-log.sh "${{ steps.sim.outputs.udid }}" longcard

      # request() types into the composer. CI has lost keystrokes there: the
      # field held "R" for "Reminders" (3 runs) and "Show t" for "Show this
      # week" (1 run), then the app answered the fragment. Repeat the two tests
      # that failed that way up to 40 times on both devices and stop at the
      # first failure. Never -retry-tests-on-failure: a retry would turn the
      # flake green and hide it. About 70-80 s per iteration of both tests.
      - name: Repeat the typed-request UI tests
        id: repeat-typed
        if: success() || steps.repeat.outcome == 'failure'
        timeout-minutes: 120
        run: |
          set +e
          if ! xcodebuild -help 2>&1 | grep -q -- '-run-tests-until-failure'; then
            echo "::error title=xcodebuild::this Xcode has no -run-tests-until-failure"
            exit 1
          fi
          date +%s > build/typed.started
          # One in-job rerun only for a backboardd soft cancel (BUG-1d).
          python3 .github/scripts/soft_cancel_rerun.py run \
            --log build/xcodebuild-typed-repeat.log \
            --result build/TypedRequestRepeat.xcresult \
            --verify "python3 .github/scripts/verify_xcresult.py {result} --iteration-log {log} --test-case testBriefingAndReminderCards --test-case testTrendsSwitchSignalsAndRange --expected-iterations 40" \
            --udid "${{ steps.sim.outputs.udid }}" \
            --touch-log build/keyboard-mode-typed \
            -- xcodebuild test-without-building \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:AuroraUITests/AuroraUITests/testBriefingAndReminderCards \
            -only-testing:AuroraUITests/AuroraUITests/testTrendsSwitchSignalsAndRange \
            -test-iterations 40 \
            -run-tests-until-failure
          status=$?
          for log in build/xcodebuild-typed-repeat.log build/xcodebuild-typed-repeat-rerun.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            grep -E "error:|Test [Cc]ase '.*' failed|Test Suite '.*' failed|✘|\*\* .* \*\*|Executed" "$log" | head -200
            for t in testBriefingAndReminderCards testTrendsSwitchSignalsAndRange; do
              echo "Iterations run ($t): $(grep -cE "Test Case '.*$t\]' (passed|failed)" "$log")"
            done
            python3 .github/scripts/xcode-annotate.py "$log"
          done
          exit $status

      - name: Keyboard-mode and touch diagnostics (typed repeat)
        if: always()
        run: bash .github/scripts/keyboard-mode-log.sh "${{ steps.sim.outputs.udid }}" typed

      # Still runs after the repeat step fails, so a flake doesn't hide the
      # rest of the suite's results; not after a failed build.
      # verify_xcresult rejects skips, so suites that don't belong in this
      # run are left out instead: UI review captures run only on request,
      # and the accessibility audit runs on iPhone only.
      - name: Test
        if: success() || steps.repeat.outcome == 'failure' || steps.repeat-typed.outcome == 'failure'
        run: |
          set +e
          skip=(-skip-testing:AuroraUITests/UIReviewCaptureUITests)
          if [ "${{ matrix.device }}" = "iPad" ]; then skip+=(-skip-testing:AuroraUITests/AccessibilityAuditUITests); fi
          date +%s > build/test.started
          # One in-job rerun only for a backboardd soft cancel (BUG-1d).
          python3 .github/scripts/soft_cancel_rerun.py run \
            --log build/xcodebuild-test.log \
            --result build/AuroraTests.xcresult \
            --verify "python3 .github/scripts/verify_xcresult.py {result}" \
            --udid "${{ steps.sim.outputs.udid }}" \
            --touch-log build/keyboard-mode-test \
            -- xcodebuild test-without-building \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -parallel-testing-enabled NO \
            "${skip[@]}"
          status=$?
          for log in build/xcodebuild-test.log build/xcodebuild-test-rerun.log; do
            [ -f "$log" ] || continue
            echo "== $log"
            grep -E "error:|warning: .*/Aurora|Test [Cc]ase '.*' failed|Test Suite '.*' failed|✘|\*\* .* \*\*|Executed" "$log" | head -400
            python3 .github/scripts/xcode-annotate.py "$log"
            # Launch and runner failures don't use the error: format; surface them
            # too, within the ten error annotations a step keeps.
            grep -iE "failed to launch|timed out|launch timeout|crashed|lost connection|failed background assertion|signal [0-9]+" "$log" \
              | sort -u | head -6 | while IFS= read -r line; do echo "::error title=xcodebuild launch::${line//%/%25}"; done
          done
          exit $status

      - name: Keyboard-mode and touch diagnostics (Test)
        if: always()
        run: bash .github/scripts/keyboard-mode-log.sh "${{ steps.sim.outputs.udid }}" test

      # An actual optimized Release launch without Debug reset/gallery hooks.
      # The simulator is disposable CI infrastructure; remove only its fixture
      # app so this exercises first install rather than a Debug-state upgrade.
      - name: Release clean-install smoke test
        if: ${{ !cancelled() && (success() || steps.repeat.outcome == 'failure' || steps.repeat-typed.outcome == 'failure') }}
        run: |
          mkdir -p build
          udid="${{ steps.sim.outputs.udid }}"
          # simctl uninstall needs a booted device. After a long test step the
          # simulator can be Shutdown (iPad, run 42652817144: CoreSimulator 405),
          # which left the earlier build and its completed setup installed, so
          # this "clean install" opened past onboarding. Boot first, uninstall,
          # and fail unless the app is really gone.
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl uninstall "$udid" com.nmapaye.aurora || true
          if xcrun simctl get_app_container "$udid" com.nmapaye.aurora >/dev/null 2>&1; then
            echo "::error title=Release smoke::com.nmapaye.aurora still installed; not a clean install"
            exit 1
          fi
          set +e
          xcodebuild test \
            -project Aurora.xcodeproj -scheme AuroraReleaseSmoke -configuration Release \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/ReleaseSmokeDerivedData \
            -parallel-testing-enabled NO \
            -only-testing:AuroraUITests/ReleaseSmokeUITests \
            -resultBundlePath build/ReleaseSmoke.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            > build/xcodebuild-release-smoke.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then python3 .github/scripts/verify_xcresult.py build/ReleaseSmoke.xcresult || status=$?; fi
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-release-smoke.log
          exit $status

      # It targets a generic iOS device, so CI checks
      # the Info.plist that would ship: no local networking exception.
      - name: Release device build
        if: ${{ !cancelled() && matrix.device == 'iPhone' }}
        run: |
          mkdir -p build
          set +e
          xcodebuild build \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > build/xcodebuild-release-device.log 2>&1
          status=$?
          grep -E "error:|\*\* .* \*\*" build/xcodebuild-release-device.log | head -200
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-release-device.log
          [ $status -eq 0 ] || exit $status
          set -e
          device=build/DerivedData/Build/Products/Release-iphoneos/Aurora.app/Info.plist
          [ -f "$device" ] || { echo "::error::missing $device"; exit 1; }
          if plutil -extract NSAppTransportSecurity xml1 -o - "$device" >/dev/null 2>&1; then
            echo "::error::Release device Info.plist contains NSAppTransportSecurity"
            plutil -p "$device"
            exit 1
          fi
          echo "Release device Info.plist has no NSAppTransportSecurity."
          python3 .github/scripts/verify_beta_scope.py "$device"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcodebuild-logs-${{ matrix.device }}
          path: |
            build/*.log
            build/*.ndjson
            build/AuroraTests.xcresult
            build/LongCardRepeat.xcresult
            build/TypedRequestRepeat.xcresult
            build/AuroraTests-Rerun.xcresult
            build/LongCardRepeat-Rerun.xcresult
            build/TypedRequestRepeat-Rerun.xcresult
            build/KeyboardProbe.xcresult
            build/ReleaseSmoke.xcresult

  # Standard public-repository Actions usage is free; do not use this route
  # for a private repository without a separate cost assessment.
  unsigned-device-artifact:
    name: unsigned iphoneos artifact only
    if: github.event_name == 'workflow_dispatch' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify explicit reviewed SHA
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Build unsigned iphoneos only
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project Aurora.xcodeproj -scheme Aurora -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > build/xcodebuild-release-device.log 2>&1
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-release-device.log
          device=build/DerivedData/Build/Products/Release-iphoneos/Aurora.app/Info.plist
          test -f "$device"
          if plutil -extract NSAppTransportSecurity xml1 -o - "$device" >/dev/null 2>&1; then
            echo '::error::Unexpected device networking exception'
            exit 1
          fi
          python3 .github/scripts/verify_beta_scope.py "$device"

      # Unsigned, public-source payload only; no provisioning/keychain/ASC access.
      # A tar preserves app executable modes and bundle layout across artifact ZIPs.
      - name: Package unsigned device app
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          app=build/DerivedData/Build/Products/Release-iphoneos/Aurora.app
          test -f "$app/Aurora"
          test ! -e "$app/embedded.mobileprovision"
          test ! -e "$app/_CodeSignature"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = com.nmapaye.aurora
          test "$(/usr/libexec/PlistBuddy -c 'Print DTPlatformName' "$app/Info.plist")" = iphoneos
          lipo "$app/Aurora" -verify_arch arm64
          mkdir -p build/unsigned-device
          cp Aurora/Aurora.entitlements build/unsigned-device/requested-entitlements.plist
          # Requested entitlements are signing INPUTS, not a claim of granted rights.
          xcodebuild -version > build/unsigned-device/xcode-version.txt
          xcrun --sdk iphoneos --show-sdk-version > build/unsigned-device/sdk-version.txt
          dwarfdump --uuid "$app/Aurora" > build/unsigned-device/binary-uuid.txt
          tar -cf build/unsigned-device/Aurora-unsigned.tar -C build/DerivedData/Build/Products/Release-iphoneos Aurora.app
          dsym=build/DerivedData/Build/Products/Release-iphoneos/Aurora.app.dSYM
          if [ -d "$dsym" ]; then
            tar -rf build/unsigned-device/Aurora-unsigned.tar -C build/DerivedData/Build/Products/Release-iphoneos Aurora.app.dSYM
          fi
          python3 - <<'PYMETA'
          import hashlib, json, os, pathlib, plistlib
          root = pathlib.Path('build/unsigned-device')
          info = plistlib.loads(pathlib.Path('build/DerivedData/Build/Products/Release-iphoneos/Aurora.app/Info.plist').read_bytes())
          metadata = {
              'schema': 1, 'signed': False, 'installReady': False,
              'sourceSha': os.environ['SOURCE_SHA'], 'runId': os.environ['RUN_ID'],
              'runAttempt': os.environ['RUN_ATTEMPT'],
              'bundleId': info['CFBundleIdentifier'],
              'version': info['CFBundleShortVersionString'], 'build': info['CFBundleVersion'],
              'minimumOS': info.get('MinimumOSVersion'), 'platform': info['DTPlatformName'],
              'payloadSha256': hashlib.sha256((root / 'Aurora-unsigned.tar').read_bytes()).hexdigest(),
              'entitlementsSha256': hashlib.sha256((root / 'requested-entitlements.plist').read_bytes()).hexdigest(),
          }
          (root / 'provenance.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PYMETA

      - name: Retain unsigned device app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-iphoneos-${{ github.sha }}
          path: build/unsigned-device/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false


  # The one check the main ruleset requires. It passes when every job
  # passed, or when the jobs were skipped because nothing in the app changed.
  gate:
    name: iOS App gate
    needs: [changes, privacy-manifest, build-and-test]
    if: always() && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
        run: |
          set -euo pipefail
          [ "$CHANGES" = "success" ] || { echo "::error::changes job: $CHANGES"; exit 1; }
          check() {
            if [ "$RELEVANT" = "true" ] && [ "$2" != "success" ]; then
              echo "::error::$1 must execute successfully for app changes: $2"; exit 1
            fi
            case "$2" in
              success|skipped) echo "$1: $2" ;;
              *) echo "::error::$1: $2"; exit 1 ;;
            esac
          }
          check "build-and-test" "${{ needs.build-and-test.result }}"
          [ "${{ needs.privacy-manifest.result }}" = success ] || { echo "::error::privacy manifest did not pass"; exit 1; }

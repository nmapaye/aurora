name: Swift Core

on:
  push:
    branches: [main]
    paths:
      - 'AuroraCore/**'
      - '.github/workflows/core-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AuroraCore/**'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: swift-core (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build
        working-directory: AuroraCore
        run: swift build --build-tests

      - name: Test
        working-directory: AuroraCore
        run: swift test

  macos:
    name: swift-core (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Test
        working-directory: AuroraCore
        run: swift test

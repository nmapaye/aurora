name: Release (TestFlight)

# Archives the Aurora app and uploads it to App Store Connect for TestFlight.
# Manual only. The job uses the protected "release" environment, which holds
# the App Store Connect API key and waits for the owner's approval on every
# run. Setup and prerequisites: docs/xcode-development.md.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes for this build (shown in the run summary only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-testflight
  # Never cancel a run that may be mid-upload.
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload to TestFlight
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      # Raise if builds were ever uploaded by hand with higher numbers.
      BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode and set paths
        run: |
          set -euo pipefail
          {
            echo "ARCHIVE_PATH=$RUNNER_TEMP/Aurora.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/export"
            echo "KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Compute build number
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          # run_number is fixed across re-runs, so the attempt is appended:
          # 12.1 < 12.2 < 13.1, and every attempt gets an unused number.
          build="$((RUN_NUMBER + BUILD_NUMBER_OFFSET)).${RUN_ATTEMPT}"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Build number: $build"

      - name: Preflight signing configuration
        run: |
          set -euo pipefail
          team=$(xcodebuild -showBuildSettings \
            -project Aurora.xcodeproj -scheme Aurora -configuration Release \
            -destination 'generic/platform=iOS' 2>/dev/null \
            | awk -F' = ' '/^ *DEVELOPMENT_TEAM = / {print $2; exit}')
          export_team=$(/usr/libexec/PlistBuddy -c 'Print :teamID' Config/ExportOptions.plist)
          if ! [[ "$team" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error file=Config/Signing.xcconfig::DEVELOPMENT_TEAM is not set to a 10-character Team ID."
            exit 1
          fi
          if [ "$team" != "$export_team" ]; then
            echo "::error file=Config/ExportOptions.plist::teamID ($export_team) does not match DEVELOPMENT_TEAM ($team)."
            exit 1
          fi
          echo "Team: $team"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::ASC_KEY_P8 is not set in the release environment."
            exit 1
          fi
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_PATH"
          if ! head -n 1 "$KEY_PATH" | grep -q -- '-----BEGIN PRIVATE KEY-----'; then
            echo "::error::ASC_KEY_P8 does not decode to a .p8 private key."
            exit 1
          fi

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          mkdir -p build
          set +e
          xcodebuild archive \
            -project Aurora.xcodeproj \
            -scheme Aurora \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            > build/xcodebuild-archive.log 2>&1
          status=$?
          grep -E "error:|\*\* .* \*\*" build/xcodebuild-archive.log | head -200
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-archive.log
          exit $status

      - name: Verify archive
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          app="$ARCHIVE_PATH/Products/Applications/Aurora.app"
          info="$app/Info.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print :$1" "$2" 2>/dev/null; }
          fail=0

          version=$(pb CFBundleShortVersionString "$info")
          build=$(pb CFBundleVersion "$info")
          bundle=$(pb CFBundleIdentifier "$info")
          echo "Version $version ($build), $bundle"
          [ "$build" = "$BUILD_NUMBER" ] || { echo "::error::CFBundleVersion is $build, expected $BUILD_NUMBER"; fail=1; }
          [ "$bundle" = "com.nmapaye.aurora" ] || { echo "::error::Bundle identifier is $bundle"; fail=1; }

          # Arbitrary loads must never ship. Aurora/Info.plist deliberately
          # allows local networking for the simulator-only Ollama option, so
          # that is reported, not failed.
          if pb NSAppTransportSecurity "$info" >/dev/null; then
            for key in NSAllowsArbitraryLoads NSAllowsArbitraryLoadsInWebContent NSAllowsArbitraryLoadsForMedia NSExceptionDomains; do
              if pb "NSAppTransportSecurity:$key" "$info" >/dev/null; then
                echo "::error::Info.plist NSAppTransportSecurity contains $key"; fail=1
              fi
            done
            echo "::warning::Info.plist contains NSAppTransportSecurity: $(pb NSAppTransportSecurity "$info" | tr -s ' \n' ' ')"
          fi

          [ -f "$app/PrivacyInfo.xcprivacy" ] || { echo "::error::PrivacyInfo.xcprivacy is not embedded"; fail=1; }

          entitlements="$RUNNER_TEMP/entitlements.plist"
          codesign -d --entitlements - --xml "$app" > "$entitlements"
          plutil -p "$entitlements"
          [ "$(pb com.apple.developer.healthkit "$entitlements")" = "true" ] \
            || { echo "::error::HealthKit entitlement missing"; fail=1; }
          [ "$(pb com.apple.developer.healthkit.background-delivery "$entitlements")" = "true" ] \
            || { echo "::error::HealthKit background delivery entitlement missing"; fail=1; }
          if pb aps-environment "$entitlements" >/dev/null; then
            echo "::error::Unexpected APNs entitlement (aps-environment)"; fail=1
          fi
          exit $fail

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +e
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > build/xcodebuild-export.log 2>&1
          status=$?
          grep -E "error:|\*\* .* \*\*|Upload|upload" build/xcodebuild-export.log | head -200
          python3 .github/scripts/xcode-annotate.py build/xcodebuild-export.log
          if [ -f "$EXPORT_PATH/DistributionSummary.plist" ]; then
            plutil -p "$EXPORT_PATH/DistributionSummary.plist"
          fi
          exit $status

      - name: Summary
        if: success()
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          NOTES: ${{ inputs.notes }}
        run: |
          {
            echo "### Uploaded Aurora build $BUILD_NUMBER"
            echo
            echo "Processing continues in App Store Connect; assign the build to the internal TestFlight group there."
            if [ -n "$NOTES" ]; then
              echo
              echo "#### Notes"
              printf '%s\n' "$NOTES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dSYMs
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsyms-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/Aurora.xcarchive/dSYMs/
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-logs-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/entitlements.plist"
          # -allowProvisioningUpdates can import signing identities into the
          # login keychain and download profiles; remove them from the runner.
          keychain="$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" 2>/dev/null \
            | awk '/"Apple (Development|Distribution)/ {print $2}' \
            | while read -r hash; do
                security delete-identity -Z "$hash" "$keychain" >/dev/null 2>&1 || true
              done
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles" \
                 "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
